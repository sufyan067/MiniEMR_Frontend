<div class="login-page">

    <div class="login-bg-overlay"></div>

    <div class="login-card">

        <div class="brand-section">
            <div class="brand-icon">
                <mat-icon>local_hospital</mat-icon>
            </div>
            <h1 class="brand-name">CureEMR</h1>
            <p class="brand-tagline">Electronic Medical Records System</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="login()" class="login-form">

            <div class="form-group">
                <label class="form-label">Username</label>
                <div class="input-wrap" [class.input-error]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
                    <mat-icon class="input-icon">person_outline</mat-icon>
                    <input formControlName="username" placeholder="Enter your username" autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrap" [class.input-error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
                    <mat-icon class="input-icon">lock_outline</mat-icon>
                    <input formControlName="password"
                           [type]="showPassword() ? 'text' : 'password'"
                           placeholder="Enter your password"
                           autocomplete="current-password">
                    <button type="button" class="toggle-pw" (click)="showPassword.set(!showPassword())">
                        <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </button>
                </div>
            </div>

            @if (errorMessage()) {
                <div class="error-alert">
                    <mat-icon>error_outline</mat-icon>
                    {{ errorMessage() }}
                </div>
            }

            <button class="sign-in-btn" type="submit" [disabled]="isLoading()">
                @if (isLoading()) {
                    <span class="spinner"></span>
                    Signing in&hellip;
                } @else {
                    <mat-icon>login</mat-icon>
                    Sign In
                }
            </button>

        </form>

        <p class="footer-note">Secure access &mdash; authorised personal only</p>

    </div>

</div>
